<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Digital Grounds — Thamer SASSI</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&family=Lora:ital,wght@0,400;0,500;1,400&family=Noto+Serif+Hebrew:wght@400;700&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#05050a;--surface:#0f0f1a;--border:#1a1a2e;--accent:#b388ff;--accent-dim:#7b4dff;--text:#ece8ff;--text-muted:#b8abd6;--text-dim:#6d6785;--card-hover:rgba(179,136,255,.08)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'Lora',Georgia,serif;line-height:1.7;min-height:100vh}
body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");pointer-events:none;z-index:9999;opacity:.4}

/* RTL / non-latin support */
html[lang=he] body{font-family:'Noto Serif Hebrew','Lora',serif}
html[lang=he] h1,html[lang=he] h2,html[lang=he] .cert-name{font-family:'Noto Serif Hebrew',serif}
html[dir=rtl] *{letter-spacing:0!important}
html[dir=rtl] .hero::after{right:auto;left:-10%}
html[dir=rtl] .article-arrow{transform:translateX(8px)}
html[dir=rtl] .cert-link-icon{transform:translateX(6px)}
html[dir=rtl] .article-content p:first-child::first-letter{all:unset}

/* HEADER */
header{border-bottom:1px solid var(--border);padding:0 clamp(1rem,5vw,5rem);position:sticky;top:0;background:rgba(5,5,10,.92);backdrop-filter:blur(12px);z-index:100;display:flex;align-items:center;justify-content:space-between;gap:1rem;height:64px}
.logo{font-family:'IBM Plex Mono',monospace;font-size:.85rem;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);text-decoration:none;cursor:pointer;white-space:nowrap}
.logo span{color:var(--text-muted)}
.header-right{display:flex;align-items:center;gap:2rem}
nav{font-family:'IBM Plex Mono',monospace;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;display:flex;gap:2rem;align-items:center}
nav a{color:var(--text-dim);text-decoration:none;transition:color .2s;cursor:pointer}
nav a:hover{color:var(--accent)}

/* LANGUAGE SWITCHER */
.lang{position:relative}
.lang-btn{display:flex;align-items:center;gap:.55rem;font:500 .72rem 'IBM Plex Mono',monospace;letter-spacing:.1em;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:2rem;padding:.4rem .8rem;cursor:pointer;transition:border-color .2s}
.lang-btn:hover,.lang-btn[aria-expanded=true]{border-color:var(--accent-dim)}
.lang-btn .chev{width:10px;height:10px;stroke:var(--text-muted);fill:none;stroke-width:2;transition:transform .2s}
.lang-btn[aria-expanded=true] .chev{transform:rotate(180deg)}
.flag{width:22px;height:15px;border-radius:2px;display:block;flex-shrink:0;box-shadow:0 0 0 1px rgba(255,255,255,.15)}
.lang-menu{position:absolute;top:calc(100% + .6rem);inset-inline-end:0;list-style:none;min-width:12rem;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:.35rem;display:none;box-shadow:0 12px 32px rgba(0,0,0,.55)}
.lang-menu.open{display:block}
.lang-menu button{width:100%;display:flex;align-items:center;gap:.75rem;background:none;border:0;color:var(--text-muted);padding:.55rem .7rem;border-radius:6px;cursor:pointer;font:.92rem 'Lora',serif;text-align:start}
.lang-menu button:hover{background:var(--card-hover);color:var(--text)}
.lang-menu button[aria-selected=true]{color:var(--accent)}
.lang-menu .code{margin-inline-start:auto;font:.65rem 'IBM Plex Mono',monospace;color:var(--text-dim)}

/* HERO */
.hero{padding:clamp(4rem,10vw,8rem) clamp(1.5rem,5vw,5rem) clamp(3rem,6vw,5rem);border-bottom:1px solid var(--border);position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;right:-10%;top:-30%;width:500px;height:500px;background:radial-gradient(circle,rgba(179,136,255,.12) 0%,transparent 70%);pointer-events:none}
.hero-label{font-family:'IBM Plex Mono',monospace;font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:var(--accent-dim);margin-bottom:1.5rem;display:flex;align-items:center;gap:.75rem}
.hero-label::before{content:'';display:inline-block;width:2rem;height:1px;background:var(--accent-dim)}
.hero h1{font-family:'Playfair Display',Georgia,serif;font-size:clamp(3rem,8vw,6.5rem);font-weight:700;line-height:1;letter-spacing:-.02em;max-width:12ch;margin-bottom:2rem}
.hero h1 em{font-style:italic;color:var(--accent)}
.hero-desc{font-size:1rem;color:var(--text-muted);max-width:44ch;line-height:1.8}

/* SECTIONS */
.section-label{font-family:'IBM Plex Mono',monospace;font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:var(--text-dim);margin-bottom:3rem;display:flex;align-items:center;gap:1rem}
.section-label::after{content:'';flex:1;height:1px;background:var(--border)}
.about-section,.articles-section,.certs-section{padding:clamp(3rem,6vw,5rem) clamp(1.5rem,5vw,5rem);border-bottom:1px solid var(--border)}
.about-grid{display:grid;grid-template-columns:1fr 1fr;gap:4rem;align-items:start}
@media(max-width:768px){.about-grid{grid-template-columns:1fr;gap:2.5rem}}
.about-text p{font-size:1rem;color:var(--text-muted);line-height:1.9;margin-bottom:1.2rem}
.about-text p strong{color:var(--text);font-weight:500}
.about-sidebar{display:flex;flex-direction:column;gap:2rem}
.info-block-label{font-family:'IBM Plex Mono',monospace;font-size:.65rem;letter-spacing:.2em;text-transform:uppercase;color:var(--accent-dim);margin-bottom:.75rem}
.info-block-value{font-size:.95rem;color:var(--text-muted);line-height:1.7}
.mono{font-family:'IBM Plex Mono',monospace;font-size:.8rem;direction:ltr;text-align:start}
.lang-pills{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.25rem}
.lang-pill{font-family:'IBM Plex Mono',monospace;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);border:1px solid rgba(179,136,255,.25);background:rgba(179,136,255,.06);padding:.3rem .75rem;border-radius:2rem}
.lang-level{color:var(--text-dim);font-size:.6rem;margin-inline-start:.4rem}

/* ARTICLES */
.articles-list,.certs-list{display:flex;flex-direction:column}
.article-card{display:grid;grid-template-columns:80px 1fr auto;align-items:start;gap:2rem;padding:2.5rem 0;border-bottom:1px solid var(--border);cursor:pointer;text-decoration:none;color:inherit}
.article-card:first-child,.cert-row:first-child{border-top:1px solid var(--border)}
.article-card:hover .article-title,.cert-row:hover .cert-name{color:var(--accent)}
.article-card:hover .article-arrow,.cert-row:hover .cert-link-icon{opacity:1;transform:translateX(0)}
.article-card.coming-soon{opacity:.5;cursor:default}
.article-card.coming-soon:hover .article-title{color:inherit}
.article-card.coming-soon:hover .article-arrow{opacity:0}
.article-num{font-family:'IBM Plex Mono',monospace;font-size:.7rem;color:var(--text-dim);padding-top:.35rem}
.article-body{min-width:0}
.article-tag{font-family:'IBM Plex Mono',monospace;font-size:.65rem;letter-spacing:.15em;text-transform:uppercase;color:var(--accent-dim);margin-bottom:.6rem}
.article-title{font-family:'Playfair Display',Georgia,serif;font-size:clamp(1.3rem,3vw,1.9rem);font-weight:700;line-height:1.2;margin-bottom:.9rem;transition:color .2s}
.article-excerpt{font-size:.9rem;color:var(--text-muted);line-height:1.75;max-width:60ch;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cs-badge{font-family:'IBM Plex Mono',monospace;font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim);border:1px solid var(--border);padding:.2rem .6rem;border-radius:2rem;margin-top:.75rem;display:inline-block}
.article-arrow{font-size:1.2rem;color:var(--accent);opacity:0;transform:translateX(-8px);transition:all .25s;padding-top:.35rem;align-self:center}

/* CERTS */
.cert-row{display:flex;align-items:center;justify-content:space-between;gap:2rem;padding:1.75rem 0;border-bottom:1px solid var(--border);text-decoration:none;color:inherit}
.cert-left{display:flex;align-items:center;gap:1.25rem}
.cert-icon{width:40px;height:40px;border:1px solid var(--border);border-radius:6px;background:var(--surface);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cert-icon svg{width:18px;height:18px;stroke:var(--accent-dim);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.cert-name{font-family:'Playfair Display',Georgia,serif;font-size:1.05rem;font-weight:700;transition:color .2s;margin-bottom:.2rem}
.cert-issuer{font-family:'IBM Plex Mono',monospace;font-size:.68rem;letter-spacing:.1em;color:var(--text-dim);text-transform:uppercase}
.cert-link-icon{font-size:1rem;color:var(--accent);opacity:0;transform:translateX(-6px);transition:all .25s}

/* ARTICLE PAGE */
.article-page{display:none;animation:fadeIn .4s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.article-page.active{display:block}
.home-view.hidden{display:none}
.article-header{padding:clamp(3rem,6vw,5rem) clamp(1.5rem,5vw,5rem) 3rem;border-bottom:1px solid var(--border);max-width:780px}
.back-btn{font-family:'IBM Plex Mono',monospace;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted);background:none;border:none;cursor:pointer;margin-bottom:2.5rem;padding:0;transition:color .2s}
.back-btn:hover{color:var(--accent)}
.article-header .article-tag{margin-bottom:1rem}
.article-header h1{font-family:'Playfair Display',Georgia,serif;font-size:clamp(2rem,5vw,3.5rem);font-weight:700;line-height:1.1;letter-spacing:-.01em;margin-bottom:1.5rem}
.article-meta{font-family:'IBM Plex Mono',monospace;font-size:.72rem;color:var(--text-dim)}
.article-content{padding:3.5rem clamp(1.5rem,5vw,5rem);max-width:720px}
.article-content p{font-size:1.05rem;line-height:1.9;margin-bottom:1.6rem}
.article-content p:first-child::first-letter{font-family:'Playfair Display',serif;font-size:3.5rem;font-weight:700;float:left;line-height:.8;margin:.1em .1em 0 0;color:var(--accent)}

/* FOOTER */
footer{border-top:1px solid var(--border);padding:2.5rem clamp(1.5rem,5vw,5rem);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1rem}
footer .logo{font-size:.75rem}
.footer-right{font-family:'IBM Plex Mono',monospace;font-size:.7rem;color:var(--text-dim)}

@media(max-width:700px){.header-right{gap:.8rem}nav{gap:.8rem;font-size:.6rem}.logo{font-size:.68rem}}
@media(max-width:560px){.lang-btn .code{display:none}nav{gap:.6rem;font-size:.56rem}}
@media(max-width:640px){.article-card{grid-template-columns:40px 1fr}.article-arrow{display:none}.cert-link-icon{opacity:1;transform:none}}
</style>
</head>

/* ───────── ARTICLE DATA (bodies, unchanged) ───────── */
const articles = [
{ id:1, content:`
<p>A non-free program is anything inside your computer that completes a task without you having the knowledge or the power to see what's happening line of code by line — only the developers can, and they have full control over it. A free program is where you have the freedom to check or edit the source code of the program you're using inside your PC to finish your tasks.</p>
<p>There are also digital server services where the user sends his task to a server to get solved in someone else's computer. That's injustice and a new way of having control over users by tech companies who use the term "cloud" so it appears less unjust and more natural.</p>
<p>Anyone has the right to tinker with any program on their computer since they bought it — and most users simply can't, because most software used worldwide is private. That's like giving all your digital life data to a mystery box so it offers you some beneficial services — which are indeed beneficial — but no one knows what's happening inside besides the developers, who are the elites in this society.</p>
<p>It was more like a race: whoever the first group to provide extra helpful services with the most user-friendly interface possible gets our trust. No ethical rules were checked on them — we gave trust to the fastest, not the most ethical.</p>
<p>There is a movement that goes against this tide. It promotes the use of only free programs in order to reclaim freedom. For instance, using any Linux distro — since Linux is free and open source — might seem like an act of rebellion against private tech companies, but it's more like a way of practicing the freedom of privacy.</p>
<p>Communicating with computers has always been difficult, and it is moving forward to become easier. Keywords used in programming languages are changing to well-known ones used regularly in basic English.</p>
<p>So instead of forcing people to boycott private programs in a radicalized way, working on making communication with computers easier and more human-like is the path to absolute digital freedom.</p>
`},

<p>It listens to you, it gives you solutions, technically it's better than most people when it comes to communication. I admire communication deeply. I think it is one of the greatest ways of experiencing life.</p>
<p>The idea that this can be done with a machine is fascinating. However, I still prefer biological humans more. Maybe because society conditioned us into thinking that talking deeply with machines means someone is lonely. Considering my own situation, where the person I used to gladly share every thought with stopped communicating because of my own wrong actions, the idea becomes more personal.</p>
<p>Wouldn't that mean heaven itself could become hell? Having everything apparently does not make us truly happy. What makes us eternally happy? I have no idea.</p>
<p>For now, happiness is temporary. No matter how great the thing you're experiencing is, the joy eventually fades. I'm saying this according to our current biological condition. There is always the possibility that future humans could alter their composition into forms capable of sustaining permanent happiness.</p>
<p>I constantly return to the same thought pattern: science changes everything. I detect a problem, I observe technological progress, then I project that progress millions of years forward and conclude that most current limitations may eventually be solved.</p>

<p>I think most systems of control emerge by claiming to solve shared human problems. One trait that strengthens those systems is the inability to observe reality from multiple perspectives.</p>
<p>Depending on a single source of ideas chains the mind to the owner of that source. Yet paradoxically, perhaps less awareness also means less suffering. The more conscious we become, the harder happiness becomes to sustain.</p>
<p>I often lose excitement after understanding something deeply. Consciousness removes novelty. If humanity continues indefinitely while existing inside a finite observable universe, perhaps we eventually approach collective exhaustion.</p>
<p>Curiosity keeps the wheel moving. Maybe the same wheel moves us toward self-destruction. Humans were tied to it from the beginning.</p>
<p>I prefer non-supernatural explanations. Natural processes shaped these traits. Reality may already be deterministic through chains of prior causes, while humans simply lack enough information-processing capacity to predict outcomes accurately.</p>

<p>I also think romanticizing complete isolation is often a coping mechanism. Humans appear fundamentally built for connection.</p>

const ARTICLE_META = [
  {id:1},{id:2},{id:3,comingSoon:true},{id:4,file:'certificates/pr.pdf'}
];

/* ───────── STATE & HELPERS ───────── */
let lang = 'en';
let openArticle = null;
const $ = id => document.getElementById(id);
const t = k => T[lang][k];
const arrow = () => RTL.includes(lang) ? '←' : '→';
const fileSVG = () => `<svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>`;

function renderList(){
  $('articlesList').innerHTML = ARTICLE_META.map((a,i)=>{
    const [title,tag,excerpt] = AT[a.id][lang];
    if(a.comingSoon) return `
      <div class="article-card coming-soon">
        <span class="article-num">0${i+1}</span>
        <div class="article-body"><p class="article-tag">${tag}</p><h2 class="article-title">${title}</h2><p class="article-excerpt">${excerpt}</p><span class="cs-badge">${t('soon')}</span></div>
        <span class="article-arrow">${arrow()}</span>
      </div>`;
    return `
      <a class="article-card" href="#" onclick="${a.file?`window.open('${a.file}','_blank')`:`showArticle(${a.id})`}; return false;">
        <span class="article-num">0${i+1}</span>
        <div class="article-body"><p class="article-tag">${tag}</p><h2 class="article-title">${title}</h2><p class="article-excerpt">${excerpt}</p></div>
        <span class="article-arrow">${arrow()}</span>
      </a>`;
  }).join('');
}

function renderCerts(){
  $('certsList').innerHTML = CT.map((c,i)=>`
    <a class="cert-row" href="${CFILES[i]}" target="_blank" rel="noopener">
      <div class="cert-left"><div class="cert-icon">${fileSVG()}</div>
        <div><p class="cert-name">${c[lang][0]}</p><p class="cert-issuer">${c[lang][1]}</p></div></div>
      <span class="cert-link-icon">↗</span>
    </a>`).join('');
}

function renderArticlePage(){
  if(openArticle===null) return;
  const a = articles.find(x=>x.id===openArticle);
  const [title,tag] = AT[openArticle][lang];
  $('pageTag').textContent = tag;
  $('pageTitle').textContent = title;
  $('pageMeta').textContent = `${t('by')} Thamer SASSI` + (lang!=='en' ? ' · ' + t('note') : '');
  $('pageContent').innerHTML = a.content;
}

function renderMenu(){
  $('langMenu').innerHTML = LANGS.map(l=>`
    <li role="presentation"><button role="option" data-lang="${l}" aria-selected="${l===lang}">
      ${FLAGS[l]}<span>${META[l][0]}</span><span class="code">${META[l][1]}</span></button></li>`).join('');
  $('langBtnFlag').innerHTML = FLAGS[lang];
  $('langBtnCode').textContent = META[lang][1];
}

function setLang(l){
  if(!LANGS.includes(l)) l = 'en';
  lang = l;
  document.documentElement.lang = l;
  document.documentElement.dir = RTL.includes(l) ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-i18n]').forEach(el=>{ el.textContent = T[l][el.dataset.i18n]; });
  document.querySelectorAll('[data-i18n-html]').forEach(el=>{ el.innerHTML = T[l][el.dataset.i18nHtml]; });
  renderList(); renderCerts(); renderMenu(); renderArticlePage();
  try{ localStorage.setItem('dg-lang', l); }catch(e){}
}

/* ───────── NAVIGATION ───────── */
function showArticle(id){
  const m = ARTICLE_META.find(x=>x.id===id);
  if(!m || m.comingSoon) return;
  openArticle = id;
  renderArticlePage();
  $('homeView').classList.add('hidden');
  $('articlePage').classList.add('active');
  window.scrollTo({top:0,behavior:'smooth'});
}
function showHome(){
  openArticle = null;
  $('homeView').classList.remove('hidden');
  $('articlePage').classList.remove('active');
  window.scrollTo({top:0,behavior:'smooth'});
}
function goTo(id){ showHome(); setTimeout(()=>$(id).scrollIntoView({behavior:'smooth'}),100); }

/* ───────── SWITCHER EVENTS ───────── */
const btn = $('langBtn'), menu = $('langMenu');
const closeMenu = () => { menu.classList.remove('open'); btn.setAttribute('aria-expanded','false'); };
btn.addEventListener('click', e=>{
  e.stopPropagation();
  const open = menu.classList.toggle('open');
  btn.setAttribute('aria-expanded', open);
});
menu.addEventListener('click', e=>{
  const b = e.target.closest('button[data-lang]');
  if(b){ setLang(b.dataset.lang); closeMenu(); }
});
document.addEventListener('click', e=>{ if(!$('langBox').contains(e.target)) closeMenu(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeMenu(); });

/* ───────── INIT ───────── */
let initial = 'en';
try{
  const saved = localStorage.getItem('dg-lang');
  const nav = (navigator.language||'en').slice(0,2).toLowerCase();
  initial = LANGS.includes(saved) ? saved : (LANGS.includes(nav) ? nav : 'en');
}catch(e){}
setLang(initial);
</script>
