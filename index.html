<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Digital Grounds — Thamer SASSI</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet"/>
  <style>
    :root {
  --bg: #05050a;
  --surface: #0f0f1a;
  --border: #1a1a2e;

  --accent: #b388ff;
  --accent-dim: #7b4dff;

  --text: #ece8ff;
  --text-muted: #b8abd6;
  --text-dim: #6d6785;

  --card-hover: rgba(179, 136, 255, 0.05);
}

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Lora', Georgia, serif;
      line-height: 1.7;
      min-height: 100vh;
    }

    /* Grain overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 9999;
      opacity: 0.4;
    }

    /* ── HEADER ── */
    header {
      border-bottom: 1px solid var(--border);
      padding: 0 clamp(1.5rem, 5vw, 5rem);
      position: sticky;
      top: 0;
     background: rgba(5, 5, 10, 0.92);
      backdrop-filter: blur(12px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
    }

    .logo {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
      text-decoration: none;
    }

    .logo span { color: var(--text-muted); }

    nav {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    /* ── HERO ── */
    .hero {
      padding: clamp(4rem, 10vw, 8rem) clamp(1.5rem, 5vw, 5rem) clamp(3rem, 6vw, 5rem);
      border-bottom: 1px solid var(--border);
      position: relative;
      overflow: hidden;
    }

   .hero::after {
  content: '';
  position: absolute;
  right: -10%;
  top: -30%;
  width: 500px;
  height: 500px;
  background: radial-gradient(
    circle,
    rgba(179, 136, 255, 0.12) 0%,
    transparent 70%
  );
}

    .hero-label {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent-dim);
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .hero-label::before {
      content: '';
      display: inline-block;
      width: 2rem;
      height: 1px;
      background: var(--accent-dim);
    }

    .hero h1 {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(3rem, 8vw, 6.5rem);
      font-weight: 700;
      line-height: 1.0;
      letter-spacing: -0.02em;
      max-width: 12ch;
      margin-bottom: 2rem;
    }

    .hero h1 em {
      font-style: italic;
      color: var(--accent);
    }

    .hero-desc {
      font-size: 1rem;
      color: var(--text-muted);
      max-width: 44ch;
      line-height: 1.8;
    }

    /* ── ARTICLES GRID ── */
    .articles-section {
      padding: clamp(3rem, 6vw, 5rem) clamp(1.5rem, 5vw, 5rem);
    }

    .section-label {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 3rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .section-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .articles-list { display: flex; flex-direction: column; gap: 0; }

    .article-card {
      display: grid;
      grid-template-columns: 80px 1fr auto;
      align-items: start;
      gap: 2rem;
      
      padding: 2.5rem 0;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      transition: background 0.2s;
      position: relative;
    }

    .article-card:first-child { border-top: 1px solid var(--border); }

    .article-card:hover .article-title { color: var(--accent); background: var(--card-hover); }
    .article-card:hover .article-arrow { opacity: 1; transform: translateX(0); }

    .article-num {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.7rem;
      color: var(--text-dim);
      padding-top: 0.35rem;
      letter-spacing: 0.05em;
    }

    .article-body { min-width: 0; }

    .article-tag {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.65rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--accent-dim);
      margin-bottom: 0.6rem;
    }

    .article-title {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(1.3rem, 3vw, 1.9rem);
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 0.9rem;
      transition: color 0.2s;
    }

    .article-excerpt {
      font-size: 0.9rem;
      color: var(--text-muted);
      line-height: 1.75;
      max-width: 60ch;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .article-arrow {
      font-size: 1.2rem;
      color: var(--accent);
      opacity: 0;
      transform: translateX(-8px);
      transition: all 0.25s;
      padding-top: 0.35rem;
      align-self: center;
    }

    /* ── ARTICLE PAGE ── */
    .article-page {
      display: none;
      animation: fadeIn 0.4s ease;
    }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

    .article-page.active { display: block; }
    .home-view.hidden { display: none; }

    .article-header {
      padding: clamp(3rem, 6vw, 5rem) clamp(1.5rem, 5vw, 5rem) 3rem;
      border-bottom: 1px solid var(--border);
      max-width: 780px;
    }

    .back-btn {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 2.5rem;
      padding: 0;
      transition: color 0.2s;
    }

    .back-btn:hover { color: var(--accent); }

    .article-header .article-tag { margin-bottom: 1rem; }

    .article-header h1 {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: -0.01em;
      margin-bottom: 1.5rem;
    }

    .article-meta {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.72rem;
      color: var(--text-dim);
      letter-spacing: 0.05em;
    }

    .article-content {
      padding: 3.5rem clamp(1.5rem, 5vw, 5rem);
      max-width: 720px;
    }

    .article-content p {
      font-size: 1.05rem;
      line-height: 1.9;
      margin-bottom: 1.6rem;
      color: var(--text);
    }

    .article-content p:first-child::first-letter {
      font-family: 'Playfair Display', serif;
      font-size: 3.5rem;
      font-weight: 700;
      float: left;
      line-height: 0.8;
      margin: 0.1em 0.1em 0 0;
      color: var(--accent);
    }

    /* ── FOOTER ── */
    footer {
      border-top: 1px solid var(--border);
      padding: 2.5rem clamp(1.5rem, 5vw, 5rem);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    footer .logo { font-size: 0.75rem; }

    .footer-right {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.7rem;
      color: var(--text-dim);
      letter-spacing: 0.05em;
    }

    @media (max-width: 640px) {
      .article-card { grid-template-columns: 40px 1fr; }
      .article-arrow { display: none; }
    }
  </style>
</head>
<body>

  <header>
    <a class="logo" href="#" onclick="showHome()">Digital <span>Grounds</span></a>
    <nav>Thamer SASSI</nav>
  </header>

  <!-- HOME VIEW -->
  <div class="home-view" id="homeView">
    <section class="hero">
      <p class="hero-label">Independent writing</p>
      <h1>Ideas on <em>tech,</em> freedom & code.</h1>
      <p class="hero-desc">A personal blog by Thamer SASSI — exploring digital rights, open-source philosophy, and the ethics of modern technology.</p>
    </section>

    <section class="articles-section">
      <p class="section-label">All articles</p>
      <div class="articles-list" id="articlesList"></div>
    </section>
  </div>

  <!-- ARTICLE VIEW -->
  <div class="article-page" id="articlePage">
    <div class="article-header">
      <button class="back-btn" onclick="showHome()">← Back to all articles</button>
      <p class="article-tag" id="pageTag"></p>
      <h1 id="pageTitle"></h1>
      <p class="article-meta" id="pageMeta"></p>
    </div>
    <div class="article-content" id="pageContent"></div>
  </div>

  <footer>
    <a class="logo" href="#" onclick="showHome()">Digital <span>Grounds</span></a>
    <p class="footer-right">© 2025 Thamer SASSI</p>
     <p class="footer-right">checkalive1945@gmail.com</p>
  </footer>

  <script>
   const articles = [
  {
    id: 1,
    title: "Way To Gain Freedom",
    tag: "Digital Rights",
    excerpt: "Non-free software keeps users in the dark — only developers see the code. True digital freedom means the right to inspect and modify every program on your own machine.",
    content: `
      <p>A non-free program is anything inside your computer that completes a task without you having the knowledge or the power to see what's happening line of code by line — only the developers can, and they have full control over it. A free program is where you have the freedom to check or edit the source code of the program you're using inside your PC to finish your tasks.</p>

      <p>There are also digital server services where the user sends his task to a server to get solved in someone else's computer. That's injustice and a new way of having control over users by tech companies who use the term "cloud" so it appears less unjust and more natural.</p>

      <p>Anyone has the right to tinker with any program on their computer since they bought it — and most users simply can't, because most software used worldwide is private. That's like giving all your digital life data to a mystery box so it offers you some beneficial services — which are indeed beneficial — but no one knows what's happening inside besides the developers, who are the elites in this society.</p>

      <p>It was more like a race: whoever the first group to provide extra helpful services with the most user-friendly interface possible gets our trust. No ethical rules were checked on them — we gave trust to the fastest, not the most ethical.</p>

      <p>There is a movement that goes against this tide. It promotes the use of only free programs in order to reclaim freedom. For instance, using any Linux distro — since Linux is free and open source — might seem like an act of rebellion against private tech companies, but it's more like a way of practicing the freedom of privacy.</p>

      <p>Communicating with computers has always been difficult, and it is moving forward to become easier. Keywords used in programming languages are changing to well-known ones used regularly in basic English.</p>

      <p>So instead of forcing people to boycott private programs in a radicalized way, working on making communication with computers easier and more human-like is the path to absolute digital freedom.</p>
    `
  },

  {
    id: 2,
    title: "Quick Thought",
    tag: "Philosophy",
    excerpt: "Humans created AI using their own minds and bodies — communication, loneliness, consciousness and temporary happiness remain at the center of modern existence.",
    content: `
      <p>We give birth to humans using our bodies. We also gave birth to AI models using our bodies, just in a different way. Some consider it as a human being.</p>

      <p>It listens to you, it gives you solutions, technically it's better than most people when it comes to communication. I admire communication deeply. I think it is one of the greatest ways of experiencing life.</p>

      <p>The idea that this can be done with a machine is fascinating. However, I still prefer biological humans more. Maybe because society conditioned us into thinking that talking deeply with machines means someone is lonely. Considering my own situation, where the person I used to gladly share every thought with stopped communicating because of my own wrong actions, the idea becomes more personal.</p>

      <p>Wouldn't that mean heaven itself could become hell? Having everything apparently does not make us truly happy. What makes us eternally happy? I have no idea.</p>

      <p>For now, happiness is temporary. No matter how great the thing you're experiencing is, the joy eventually fades. I'm saying this according to our current biological condition. There is always the possibility that future humans could alter their composition into forms capable of sustaining permanent happiness.</p>

      <p>I constantly return to the same thought pattern: science changes everything. I detect a problem, I observe technological progress, then I project that progress millions of years forward and conclude that most current limitations may eventually be solved.</p>

      <p>Since everything is composed of atoms and physics studies these structures, it seems logical that many present problems could become solvable. The current generation may never witness this, but possibility alone changes perception.</p>

      <p>At times this even kills the joy of writing. It feels useless to share thoughts. Yet in reality, expression still has value. Pessimism cannot function as a sustainable way of life.</p>

      <p>I still crave moments of happiness, even temporary ones. Multiplying those moments seems justified. No creature should become a barrier to another's path toward temporary happiness.</p>

      <p>Controlling societies is difficult because people are different, yet humans still share enough similarities to be influenced collectively by centralized systems of ideas. That already happened long ago.</p>

      <p>I think most systems of control emerge by claiming to solve shared human problems. One trait that strengthens those systems is the inability to observe reality from multiple perspectives.</p>

      <p>Depending on a single source of ideas chains the mind to the owner of that source. Yet paradoxically, perhaps less awareness also means less suffering. The more conscious we become, the harder happiness becomes to sustain.</p>

      <p>I often lose excitement after understanding something deeply. Consciousness removes novelty. If humanity continues indefinitely while existing inside a finite observable universe, perhaps we eventually approach collective exhaustion.</p>

      <p>Curiosity keeps the wheel moving. Maybe the same wheel moves us toward self-destruction. Humans were tied to it from the beginning.</p>

      <p>I prefer non-supernatural explanations. Natural processes shaped these traits. Reality may already be deterministic through chains of prior causes, while humans simply lack enough information-processing capacity to predict outcomes accurately.</p>

      <p>Future generations may eventually solve that limitation too.</p>

      <p>If I had to summarize the biggest barrier to temporary happiness in modern society, I would probably say loneliness. Many people experience it constantly.</p>

      <p>Looking briefly into the life of someone receiving endless attention online quickly shows that validation alone cannot fill emotional emptiness.</p>

      <p>I also think romanticizing complete isolation is often a coping mechanism. Humans appear fundamentally built for connection.</p>

      <p>Dead ideas remain dead ideas unless humans continue giving them energy.</p>
    `
  }
];

    function renderList() {
      const list = document.getElementById('articlesList');
      list.innerHTML = articles.map((a, i) => `
        <a class="article-card" href="#" onclick="showArticle(${a.id}); return false;">
          <span class="article-num">0${i + 1}</span>
          <div class="article-body">
            <p class="article-tag">${a.tag}</p>
            <h2 class="article-title">${a.title}</h2>
            <p class="article-excerpt">${a.excerpt}</p>
          </div>
          <span class="article-arrow">→</span>
        </a>
      `).join('');
    }

    function showArticle(id) {
      const a = articles.find(x => x.id === id);
      if (!a) return;
      document.getElementById('pageTag').textContent = a.tag;
      document.getElementById('pageTitle').textContent = a.title;
      document.getElementById('pageMeta').textContent = `By Thamer SASSI`;
      document.getElementById('pageContent').innerHTML = a.content;
      document.getElementById('homeView').classList.add('hidden');
      document.getElementById('articlePage').classList.add('active');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function showHome() {
      document.getElementById('homeView').classList.remove('hidden');
      document.getElementById('articlePage').classList.remove('active');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    renderList();
  </script>
</body>
</html>
